name: Bug report
description: Report a reproducible problem without private learner data.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Do not include exports, pasted JSON, Access tokens, emails, or other personal data. Use a private security report for sensitive issues.'
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: 'Use synthetic examples only.'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: 'For example: Safari 18 on iOS 18'
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [Curriculum, Practice, Sync, Backup, PWA, Accessibility, Provider bridge, Documentation]
