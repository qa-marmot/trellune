name: Actionable improvement
description: Propose a scoped, learner-centered improvement. Use Discussions for early ideas.
title: 'idea: '
labels: [enhancement]
body:
  - type: textarea
    id: learner-problem
    attributes:
      label: Learner problem
      description: 'What learning or accessibility problem would this solve?'
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Smallest useful scope
      description: 'Which screen, workflow, or contract changes? What should remain unchanged?'
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints considered
      options:
        - label: 'Does not require an AI API or provider automation'
        - label: 'Does not weaken Core/Boost or data-integrity contracts'
